{
  group:"Measure quality",
  title:"Analytics, flaky tests & Test Plans",
  tag:"test analytics · flaky detection · TIA · Azure Test Plans",
  intro:`Published results build up a history. Use it to find tests that fail often, handle <b>flaky</b> tests without hiding real bugs, run only the tests a change affects, and trace automated and manual tests back to <b>requirements</b> with Azure Test Plans.`,
  sections:[
    {h:"Test analytics", p:`The pipeline's <b>Analytics</b> tab has a <b>Test failures</b> report: the pass-rate trend and the top failing tests over a chosen period, filterable by branch, test file and owner. From the Tests tab of a run, you can open a test's <b>history</b> and create a <b>bug</b> from a failure.`},
    {h:"Flaky test management", after:`<p>A <b>flaky test</b> gives different outcomes (pass/fail) without any change in code or environment. Turn on detection in <b>Project settings → Test management</b> (Pipelines section).</p>
<div class="tablewrap"><table class="ref">
<tr><th>Option</th><th>How it works</th></tr>
<tr><td><b>System detection</b></td><td>A test that fails and then passes when rerun in the same pipeline run is marked flaky. Reruns come from VSTest's <b>rerun failed tests</b> or from <b>rerunning failed jobs</b>.</td></tr>
<tr><td><b>Custom detection</b></td><td>Your own logic marks tests through the <b>Result Meta Data – Update</b> REST API (test case reference ID, flaky flag, branch).</td></tr>
<tr><td><b>Flaky test options</b></td><td>By default flaky tests are used for troubleshooting and stay in the test summary. You can exclude them, so their results leave the pass percentage, appear under <b>Tests not reported</b>, and a flaky failure doesn't fail the pipeline.</td></tr>
</table></div>
<p>Flakiness is tracked <b>per branch</b> and shared by all pipelines on it. You can manually mark a test <b>Flaky</b> or <b>UnFlaky</b> from the results; the change applies to future runs.</p>`},
    {h:"Rerun failed tests and Test Impact Analysis (VSTest@3)", code:`- task: VSTest@3
  inputs:
    testAssemblyVer2: '**/*Tests.dll'
    rerunFailedTests: true
    rerunType: basedOnTestFailurePercentage   # don't rerun if failures exceed…
    rerunFailedThreshold: '30'                # …30% (environment probably broken)
    rerunMaxAttempts: '3'
    runOnlyImpactedTests: true                # Test Impact Analysis
    runAllTestsAfterXBuilds: '50'             # periodically run everything`},
    {h:"Azure Test Plans", after:`<div class="tablewrap"><table class="ref">
<tr><th>Item</th><th>Purpose</th></tr>
<tr><td><b>Test plan</b></td><td>Groups the suites for a sprint or release</td></tr>
<tr><td><b>Static suite</b></td><td>Test cases you add by hand (folders)</td></tr>
<tr><td><b>Requirement-based suite</b></td><td>Linked to a backlog item: its test cases are linked with <i>Tests / Tested By</i>, giving traceability</td></tr>
<tr><td><b>Query-based suite</b></td><td>Contains whatever test cases a work item query returns (e.g. Priority = 1)</td></tr>
<tr><td><b>Configurations</b></td><td>Run the same test case on several setups (OS, browser)</td></tr>
<tr><td><b>Exploratory testing</b></td><td>Unscripted testing with the <b>Test &amp; Feedback</b> browser extension; create bugs with screenshots and recordings</td></tr>
</table></div>
<p>To make automated tests count toward a plan, <b>associate</b> the test method with a test case (from Visual Studio Test Explorer). A pipeline then runs them with VSTest <code>testSelector: testPlan</code> (plan, suites, configuration), and the outcomes are recorded against the test cases, and so against the requirements. Creating and managing test plans needs the <b>Basic + Test Plans</b> access level (or an equivalent subscription). Users with Basic access can run tests.</p>`}
  ],
  tip:`"Detect tests that pass on retry" → <b>flaky test detection</b> (system detection uses VSTest rerun). "Flaky failures shouldn't break the build but must stay visible" → flaky test options: <b>exclude from the test summary</b>. "Only run tests affected by the change (.NET, VSTest)" → <b>Test Impact Analysis</b> (<code>runOnlyImpactedTests</code>). "Show which requirements are tested" → <b>requirement-based suites</b> with automated tests associated to test cases.`,
  exercises:[
    {id:"ft1", type:"multi", title:"How flaky tests are detected",
     q:`Which statements about flaky test management in Azure DevOps are true? <i>Select all that apply.</i>`,
     options:[
       "System detection marks a test flaky when it fails and then passes on a rerun within the same pipeline run",
       "Reruns can come from VSTest's rerun-failed-tests option or from rerunning failed jobs",
       "Custom detection reports flakiness through the Result Meta Data – Update REST API",
       "Once marked flaky, the status applies to all pipelines on that branch",
       "A test is automatically marked flaky after it fails in two consecutive runs",
       "Flaky tests are deleted from the test results"
     ], answer:[0,1,2,3],
     hint:`Flaky means the outcome changed without any code change, and a rerun shows exactly that.`,
     why:`System detection relies on reruns in the same run: fail then pass with the same code means flaky. Custom detection lets your own system report flakiness through the REST API. The flag is tracked per branch for every pipeline. Two consecutive failures suggest a real bug, not flakiness, and results are never deleted, only tagged.`},
    {id:"ft2", type:"mc", title:"Don't let flaky tests break the build",
     q:`Flaky test detection is on. Several known-flaky tests still fail the pipeline now and then. The team wants those failures to <b>stop failing the pipeline</b> while the flaky results stay visible for later fixing. What do you configure?`,
     options:[
       "In the flaky test options, exclude flaky tests from the test summary so they're removed from the pass percentage and shown as Tests not reported",
       "Set failTaskOnFailedTests: false on every task",
       "Delete the flaky tests from the repository",
       "Add continueOnError: true to every test step"
     ], answer:0,
     hint:`The setting lives on the same Test management page that turns on detection.`,
     why:`By default flaky tests stay in the test summary (for troubleshooting only). Choosing to exclude them removes flaky results from the pass percentage and lists them under <b>Tests not reported</b>, so a flaky failure doesn't fail the run, and the data stays available. <code>continueOnError</code> would hide <i>real</i> failures as well.`},
    {id:"ft3", type:"fill", title:"Rerun failed tests", mono:true,
     q:`Configure VSTest to rerun failed tests up to <b>3</b> attempts, but <b>not</b> to rerun when more than <b>30%</b> of the tests fail (that's probably a broken environment).`,
     tpl:`- task: VSTest@3
  inputs:
    testAssemblyVer2: '**/*Tests.dll'
    rerunFailedTests: [[0]]
    rerunType: [[1]]
    rerunFailedThreshold: '[[2]]'
    rerunMaxAttempts: '[[3]]'`,
     blanks:[["true"],["basedOnTestFailurePercentage"],["30"],["3"]],
     hint:`The rerun type is based on either the failure percentage or the failure count.`,
     why:`<code>rerunFailedTests: true</code> retries failed tests until they pass or the maximum number of attempts is reached. <code>basedOnTestFailurePercentage</code> with a 30% threshold skips reruns when failures are widespread. Tests that pass on a rerun feed system flaky detection.`},
    {id:"ft4", type:"match", title:"Organize Azure Test Plans",
     q:`Match each need to the Azure Test Plans feature.`,
     choices:["Requirement-based suite","Static suite","Query-based suite","Test configuration","Exploratory testing (Test & Feedback)"],
     rows:[
       ["All test cases for user story 1234, linked so the story shows its test status","Requirement-based suite"],
       ["A hand-picked folder of regression test cases","Static suite"],
       ["Automatically include every test case with Priority = 1 and the tag 'checkout'","Query-based suite"],
       ["Run the same test case on Edge and on Firefox and record both outcomes","Test configuration"],
       ["Unscripted bug hunting in the browser, capturing screenshots and notes into a bug","Exploratory testing (Test & Feedback)"]
     ],
     hint:`Requirement-based = linked to a backlog item. Query-based = driven by a work item query.`,
     why:`Requirement-based suites give traceability from the backlog item to its tests. Static suites are manual collections. Query-based suites update themselves from a query. Configurations multiply a test across environments. The Test &amp; Feedback extension supports exploratory testing.`},
    {id:"ft5", type:"order", title:"Trace a requirement to automated results",
     q:`Put the steps in order so a user story shows the results of its <b>automated</b> tests.`,
     items:[
       "Create the user story in Azure Boards",
       "Create a requirement-based suite for the story and add test cases",
       "Associate each automated test method with its test case from Visual Studio Test Explorer",
       "Run the tests from the test plan in a pipeline (VSTest with testSelector: testPlan)",
       "Review the outcomes recorded against the test cases and the story"
     ],
     hint:`You need the requirement and its test case before you can associate code with it.`,
     why:`The chain is requirement → test case (requirement-based suite) → associated automated test → run from the plan → results recorded on the test cases. That gives auditors the evidence that each requirement was tested and with what result.`},
    {id:"ft6", type:"mc", title:"Run only what changed",
     q:`A .NET solution has 6,000 MSTest tests that take 45 minutes. Most commits touch a small area. You want CI builds to run only the tests affected by each change, but still run everything regularly. What do you use?`,
     options:[
       "VSTest@3 with runOnlyImpactedTests: true (Test Impact Analysis) and runAllTestsAfterXBuilds",
       "A path filter on the CI trigger",
       "strategy: parallel: 10",
       "testFiltercriteria: Priority=1 on every build"
     ], answer:0,
     hint:`The feature maps tests to the source code they exercise.`,
     why:`<b>Test Impact Analysis</b> in VSTest selects the tests related to the changed code and periodically runs the full suite (<code>runAllTestsAfterXBuilds</code>, default 50) to refresh its mapping. Path filters only decide whether a build starts. Parallelism speeds up the full run but doesn't select tests, and a priority filter ignores what actually changed.`}
  ]
},

{
  group:"Performance & GitHub",
  title:"Load testing with Azure Load Testing",
  tag:"JMeter · Locust · fail criteria · AzureLoadTest@1 · azure/load-testing",
  intro:`<b>Azure Load Testing</b> is a fully managed service that generates high-scale load from Azure using a <b>JMeter</b> or <b>Locust</b> script, or simple <b>URL-based</b> requests. In CI/CD you keep the script and a YAML configuration in the repository and let the pipeline run the test after each deployment to a production-like environment. <b>Fail criteria</b> turn the result into a pass/fail gate.`,
  sections:[
    {h:"The test configuration file", file:"loadtest/config.yaml", code:`version: v0.1
testId: checkout-api            # 2-50 chars, a-z 0-9 _ -
displayName: Checkout API load test
testType: JMX                   # JMX | Locust | URL
testPlan: checkout.jmx          # the script (relative to this file)
engineInstances: 2              # parallel load engines
failureCriteria:
  - avg(response_time_ms) > 300
  - percentage(error) > 5
  - GetCart: p90(latency) > 200 # criterion for one request only
autoStop:
  errorPercentage: 80           # stop early if >80% errors…
  timeWindow: 60                # …within a 60-second window`,
     after:`<div class="tablewrap"><table class="ref">
<tr><th>Client metric</th><th>Aggregates</th><th>Condition</th></tr>
<tr><td><code>response_time_ms</code></td><td>avg, min, max, pNN (e.g. p90, p95, p99)</td><td>&gt; or &lt;</td></tr>
<tr><td><code>latency</code></td><td>avg, min, max, pNN</td><td>&gt; or &lt;</td></tr>
<tr><td><code>error</code></td><td>percentage</td><td>&gt;</td></tr>
<tr><td><code>requests_per_sec</code></td><td>avg</td><td>&gt; or &lt;</td></tr>
<tr><td><code>requests</code></td><td>count</td><td>&gt; or &lt;</td></tr>
</table></div>
<p>If <b>any</b> criterion is met, the test run fails. You can also define <b>server-side</b> criteria on Azure resource metrics (e.g. CPU of the app), under <code>failureCriteria.serverMetrics</code>.</p>`},
    {h:"Run it from Azure Pipelines", code:`- task: AzureLoadTest@1           # from the Azure Load Testing Marketplace extension
  inputs:
    azureSubscription: 'sc-loadtest'   # ARM service connection
    loadTestConfigFile: 'loadtest/config.yaml'
    resourceGroup: 'rg-loadtest'
    loadTestResource: 'lt-contoso'
- publish: $(System.DefaultWorkingDirectory)/loadTest
  artifact: loadTestResults
  condition: succeededOrFailed()`,
     p:`The task succeeds only if the run completes <b>and all fail criteria pass</b>, so a failing load test stops the stages that depend on it. The service principal needs the <b>Load Test Contributor</b> role on the load testing resource.`},
    {h:"…or from GitHub Actions", code:`- uses: azure/login@v2
  with:
    client-id: \${{ secrets.AZURE_CLIENT_ID }}
    tenant-id: \${{ secrets.AZURE_TENANT_ID }}
    subscription-id: \${{ secrets.AZURE_SUBSCRIPTION_ID }}
- uses: azure/load-testing@v1
  with:
    loadTestConfigFile: 'loadtest/config.yaml'
    loadTestResource: lt-contoso
    resourceGroup: rg-loadtest
- uses: actions/upload-artifact@v4
  if: always()
  with:
    name: loadTestResults
    path: \${{ github.workspace }}/loadTest`}
  ],
  tip:`"Fail the release if average response time exceeds X ms or errors exceed Y%" → <b>failureCriteria</b> in the load test config (<code>avg(response_time_ms) &gt; X</code>, <code>percentage(error) &gt; Y</code>). The pipeline step is <b>AzureLoadTest@1</b> (Azure Pipelines) or <b>azure/load-testing</b> (GitHub Actions). Permission: <b>Load Test Contributor</b>.`,
  exercises:[
    {id:"lt1", type:"text", lang:"yaml", title:"Write the load test config",
     q:`Write the Azure Load Testing configuration for a JMeter test:
      <ul class="tips">
        <li><code>version</code> <code>v0.1</code>, test ID <code>orders-api</code>, JMeter script <code>orders.jmx</code></li>
        <li>use <b>4</b> engine instances</li>
        <li>fail if the <b>average response time</b> is above <b>500 ms</b> or more than <b>2%</b> of requests fail</li>
        <li>auto-stop when the error percentage exceeds <b>90</b> within a <b>60</b>-second window</li>
      </ul>`,
     starter:`# loadtest/config.yaml
`,
     checks:[
       {l:"version: v0.1", t:a => a.h("version","v0.1")},
       {l:"testId: orders-api", t:a => a.h("testId","orders-api")},
       {l:"testType: JMX", t:a => a.h("testType",/^jmx$/i)},
       {l:"testPlan: orders.jmx", t:a => a.h("testPlan",/^(\.\/)?orders\.jmx$/i)},
       {l:"engineInstances: 4", t:a => a.h("engineInstances","4")},
       {l:"Criterion avg(response_time_ms) > 500", t:a => a.h(/^failureCriteria(\.clientMetrics)?\[\]$/,/^avg\s*\(\s*(response_time_ms|responseTimeMs)\s*\)\s*>\s*500$/i)},
       {l:"Criterion percentage(error) > 2", t:a => a.h(/^failureCriteria(\.clientMetrics)?\[\]$/,/^percentage\s*\(\s*error\s*\)\s*>\s*2$/i)},
       {l:"autoStop.errorPercentage: 90 and timeWindow: 60", t:a => a.h("autoStop.errorPercentage","90") && a.h("autoStop.timeWindow","60")}
     ],
     hint:`Fail criteria are a list of strings like <code>aggregate(metric) &gt; threshold</code>. The error metric uses the <code>percentage</code> aggregate.`,
     solution:`version: v0.1
testId: orders-api
displayName: Orders API load test
testType: JMX
testPlan: orders.jmx
engineInstances: 4
failureCriteria:
  - avg(response_time_ms) > 500
  - percentage(error) > 2
autoStop:
  errorPercentage: 90
  timeWindow: 60`,
     why:`The config file lets the pipeline create or update the test and run it. Each fail criterion is checked at the end of the run. If any is met the run fails, and so does the pipeline task. Auto-stop is a separate safety net that ends a run early when the app is clearly broken, so you don't pay for a useless test.`},
    {id:"lt2", type:"text", lang:"yaml", title:"Add the load test to the pipeline",
     q:`Write <code>steps:</code> for a job that runs after the staging deployment:
      <ul class="tips">
        <li>run the load test with <b>AzureLoadTest@1</b> using service connection <code>sc-loadtest</code>, config <code>loadtest/config.yaml</code>, resource group <code>rg-loadtest</code> and resource <code>lt-contoso</code></li>
        <li>publish the <code>$(System.DefaultWorkingDirectory)/loadTest</code> folder as pipeline artifact <code>loadTestResults</code>, <b>even if the load test failed</b></li>
      </ul>`,
     starter:`steps:
`,
     checks:[
       {l:"AzureLoadTest@1 step", t:a => a.item(STEP,{task:/^AzureLoadTest@1$/i})},
       {l:"azureSubscription: sc-loadtest", t:a => a.item(STEP,{task:/^AzureLoadTest@1$/i,"inputs.azureSubscription":"sc-loadtest"}) || a.item(STEP,{task:/^AzureLoadTest@1$/i,"inputs.connectedServiceNameARM":"sc-loadtest"})},
       {l:"loadTestConfigFile: loadtest/config.yaml", t:a => a.item(STEP,{task:/^AzureLoadTest@1$/i,"inputs.loadTestConfigFile":/^(\$\(System\.DefaultWorkingDirectory\)\/)?loadtest\/config\.yaml$/i})},
       {l:"resourceGroup and loadTestResource", t:a => a.item(STEP,{task:/^AzureLoadTest@1$/i,"inputs.resourceGroup":"rg-loadtest","inputs.loadTestResource":"lt-contoso"})},
       {l:"Publishes the loadTest folder as artifact loadTestResults", t:a => a.item(STEP,{publish:/loadTest\/?$/,artifact:"loadTestResults"}) || a.item(STEP,{task:/^PublishPipelineArtifact@1$/i,"inputs.targetPath":/loadTest\/?$/,"inputs.artifact":"loadTestResults"}) || a.item(STEP,{task:/^PublishPipelineArtifact@1$/i,"inputs.targetPath":/loadTest\/?$/,"inputs.artifactName":"loadTestResults"})},
       {l:"…with succeededOrFailed() or always()", t:a => a.item(STEP,{publish:/loadTest/,condition:COND_ALWAYS}) || a.item(STEP,{task:/^PublishPipelineArtifact@1$/i,condition:COND_ALWAYS})}
     ],
     hint:`The <code>publish:</code> shortcut takes the path, with <code>artifact:</code> and <code>condition:</code> as siblings.`,
     solution:`steps:
- task: AzureLoadTest@1
  inputs:
    azureSubscription: 'sc-loadtest'
    loadTestConfigFile: 'loadtest/config.yaml'
    resourceGroup: 'rg-loadtest'
    loadTestResource: 'lt-contoso'
- publish: $(System.DefaultWorkingDirectory)/loadTest
  artifact: loadTestResults
  condition: succeededOrFailed()`,
     why:`<code>AzureLoadTest@1</code> needs four inputs: the ARM service connection, the config file, and the resource group and name of the load testing resource. The task fails when a fail criterion is met, which stops the promotion to production. The artifact keeps the results (including CSV files) for analysis even when the test failed.`},
    {id:"lt3", type:"match", title:"Read the fail criteria",
     q:`Match each fail criterion to its meaning.`,
     choices:[
       "Fail if the 90th-percentile response time is above 800 ms",
       "Fail if more than 5% of requests return errors",
       "Fail if the system serves fewer than 100 requests per second on average",
       "Fail if the GetOrders request's average latency exceeds 200 ms",
       "Fail if the slowest single response took over 3 s"
     ],
     rows:[
       ["<code>p90(response_time_ms) &gt; 800</code>","Fail if the 90th-percentile response time is above 800 ms"],
       ["<code>percentage(error) &gt; 5</code>","Fail if more than 5% of requests return errors"],
       ["<code>avg(requests_per_sec) &lt; 100</code>","Fail if the system serves fewer than 100 requests per second on average"],
       ["<code>GetOrders: avg(latency) &gt; 200</code>","Fail if the GetOrders request's average latency exceeds 200 ms"],
       ["<code>max(response_time_ms) &gt; 3000</code>","Fail if the slowest single response took over 3 s"]
     ],
     hint:`pNN is a percentile; a prefix with a colon limits the criterion to one named request.`,
     why:`Fail criteria take the form <code>[request:] aggregate(metric) condition threshold</code>. Percentiles (p90, p95, p99) describe the tail that users feel. The error metric uses <code>percentage</code>, and throughput is <code>avg(requests_per_sec)</code>. A request name before the colon targets a single sampler in the script.`},
    {id:"lt4", type:"mc", title:"Stop a slow release",
     q:`A YAML pipeline deploys to Staging, runs <code>AzureLoadTest@1</code>, then deploys to Production in the next stage. Production must <b>not</b> be deployed if the 95th percentile response time under load exceeds 1 second. What do you do?`,
     options:[
       "Add p95(response_time_ms) > 1000 to failureCriteria in the load test config; the task then fails and the Production stage doesn't run",
       "Add a manual approval so someone reads the load test dashboard",
       "Set autoStop.errorPercentage to 95",
       "Increase engineInstances until the response time drops"
     ], answer:0,
     hint:`Make the test itself decide pass or fail.`,
     why:`A fail criterion makes the load test result pass/fail automatically. <code>AzureLoadTest@1</code> succeeds only if all criteria pass, so a failed criterion fails the Staging stage and the dependent Production stage is skipped. Auto-stop reacts to errors, not latency. More engines create <i>more</i> load; they don't make the app faster.`},
    {id:"lt5", type:"multi", title:"Prerequisites for CI/CD load tests",
     q:`What do you need to run an Azure Load Testing test from Azure Pipelines? <i>Select all that apply.</i>`,
     options:[
       "The Azure Load Testing extension installed in the Azure DevOps organization (it provides AzureLoadTest@1)",
       "An Azure Resource Manager service connection whose identity has the Load Test Contributor role on the load testing resource",
       "The test script (JMX or Locust) and the load test YAML config committed to the repository",
       "A self-hosted agent inside the load testing resource's virtual network",
       "The Owner role on the subscription for the pipeline identity"
     ], answer:[0,1,2],
     hint:`Least privilege, and the load is generated by the service, not by your agent.`,
     why:`The task comes from a Marketplace extension. The pipeline authenticates through a service connection that needs the <b>Load Test Contributor</b> role (not Owner). The script and config live in source control so the test is versioned with the app. The load engines run in Azure Load Testing, so the agent doesn't generate load. To test private endpoints, you inject the engines into a subnet with <code>subnetId</code>.`}
  ]
},

{
  group:"Performance & GitHub",
  title:"Testing in GitHub Actions",
  tag:"matrix · artifacts · service containers · required checks",
  intro:`GitHub Actions has no built-in Tests tab, so you build the same practices from workflow features: a <b>matrix</b> for multi-version runs, <b>artifacts</b> and job summaries for results, <b>service containers</b> for integration tests, and <b>required status checks</b> to gate pull requests.`,
  sections:[
    {h:"Matrix test run with results as artifacts", file:".github/workflows/test.yml", code:`name: test
on:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: \${{ matrix.os }}
    strategy:
      fail-fast: false          # default true: cancel the others on first failure
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: \${{ matrix.node }}
      - run: npm ci
      - run: npm test -- --reporters=default --reporters=jest-junit
      - uses: actions/upload-artifact@v4
        if: always()            # keep results when tests fail
        with:
          name: test-results-\${{ matrix.os }}-\${{ matrix.node }}   # unique per job
          path: junit.xml`,
     p:`The matrix creates one job per combination (here 4). <code>include</code> adds combinations or extra variables, and <code>exclude</code> removes some. With <code>upload-artifact@v4</code>, artifact names must be <b>unique</b> within a run, so put matrix values in the name. To show results on the run page, write Markdown to <code>$GITHUB_STEP_SUMMARY</code> or use a Marketplace test-reporter action that creates a check run with annotations.`},
    {h:"Service containers for integration tests", code:`jobs:
  integration:
    runs-on: ubuntu-latest      # service containers need a Linux runner
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432           # job runs on the runner → map the port, use localhost
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run test:integration
        env:
          DB_HOST: localhost
          DB_PORT: 5432`,
     p:`If the job itself runs in a container (<code>container:</code>), it shares a Docker network with the services: reach them by their <b>label</b> as the hostname (<code>postgres</code>), with no port mapping needed.`},
    {h:"Gate the pull request", p:`Add the test jobs as <b>required status checks</b> in a branch protection rule or repository ruleset on <code>main</code>. Then a PR can't merge until they pass.`}
  ],
  tip:`"Test on several Node/OS versions" → <code>strategy.matrix</code>. "Keep results when tests fail" → <code>if: always()</code> on the upload step. "Integration tests need PostgreSQL/Redis" → <b>service containers</b> (<code>localhost</code> + port mapping on the runner, or the service label from a container job). "Block merge on failing tests" → <b>required status checks</b>.`,
  exercises:[
    {id:"gh1", type:"text", lang:"yaml", title:"Matrix tests with uploaded results",
     q:`Write a workflow that runs on <b>pull requests</b>:
      <ul class="tips">
        <li>one job <code>test</code> on <code>ubuntu-latest</code> with a matrix variable <code>node</code> of <code>20</code> and <code>22</code></li>
        <li>steps: checkout, <code>actions/setup-node</code> using the matrix version, <code>npm ci</code>, <code>npm test</code></li>

/* ===================================================================
   MINI YAML PARSER (same as the Pipelines and Flow of Work labs)
   Turns YAML into a flat list of { path, value } entries, e.g.
     body[0].type = textarea
   =================================================================== */
const toStr = t => t.reduce((s, x) => x[0] === "[" ? s + x : (s ? s + "." + x : x), "");

function cleanVal(v){
  v = (v || "").trim();
  if (v[0] === "'"){ const m = v.match(/^'((?:[^']|'')*)'/); if (m) return m[1].replace(/''/g, "'"); }
  if (v[0] === '"'){ const m = v.match(/^"((?:[^"\\]|\\.)*)"/); if (m) return m[1]; }
  const ci = v.search(/(^|\s)#/);
  return (ci >= 0 ? v.slice(0, ci) : v).trim();
}

function splitFlow(inner){
  const out = []; let cur = "", depth = 0, q = null;
  for (const ch of inner){
    if (q){ cur += ch; if (ch === q) q = null; continue; }
    if (ch === "'" || ch === '"'){ q = ch; cur += ch; continue; }
    if ("[{(".includes(ch)) depth++;
    if ("]})".includes(ch)) depth--;
    if (ch === "," && depth === 0){ out.push(cur); cur = ""; continue; }
    cur += ch;
  }
  if (cur.trim()) out.push(cur);
  return out.map(s => s.trim()).filter(Boolean);
}

function parseYaml(text){
  const lines = text.replace(/\r/g, "").split("\n");
  const entries = [], errors = [];
  const root = {col:-1, gt:[], it:[], kids:null};
  const stack = [root], counters = new Map();
  const top = () => stack[stack.length - 1];
  const add = (gt, it, value, line) => entries.push({gt, it, gen:toStr(gt), idx:toStr(it), value, line});
  let flagged = -1;
  const sibling = (parent, col, ln, kind) => {
    if (parent.kind && parent.kind !== kind && flagged !== ln){
      flagged = ln;
      errors.push(`Line ${ln}: this ${kind === "list" ? "list item" : "key"} sits at the same level as ${kind === "list" ? "keys" : "\"- \" list items"} under the same parent. Check the indentation.`);
    }
    parent.kind = parent.kind || kind;
    if (parent.kids === null) parent.kids = col;
    else if (parent.kids !== col && flagged !== ln)
      errors.push(`Line ${ln}: indented ${col} spaces, but its siblings use ${parent.kids}. Items at the same level must line up exactly.`);
  };
  let lastScalar = null;

  for (let i = 0; i < lines.length; i++){
    const raw = lines[i], ln = i + 1;
    if (!raw.trim() || /^\s*#/.test(raw)) continue;
    if (/^ *\t/.test(raw)){ errors.push(`Line ${ln}: a tab is used for indentation. YAML only allows spaces.`); continue; }
    const lineCol = raw.match(/^ */)[0].length;
    let col = lineCol, rest = raw.slice(col).replace(/\s+$/, "");
    if (lastScalar && col > lastScalar.col && (flagged = ln))
      errors.push(`Line ${ln}: indented under "${lastScalar.key}" (line ${lastScalar.ln}), but that key already has a value on its own line.`);
    lastScalar = null;

    let dashNode = null;
    while (/^-(\s|$)/.test(rest)){
      while (stack.length > 1 && (top().col > col || (top().dash && top().col === col))) stack.pop();
      const parent = top();
      sibling(parent, col, ln, "list");
      const n = counters.get(parent) ?? 0; counters.set(parent, n + 1);
      dashNode = {col, gt:[...parent.gt, "[]"], it:[...parent.it, `[${n}]`], kids:null, dash:true};
      stack.push(dashNode);
      const m = rest.match(/^-\s*/)[0].length;
      col += m; rest = rest.slice(m);
    }
    if (!rest) continue;

    const km = /^['"]/.test(rest) ? null : rest.match(/^(.+?)\s*:(?:\s+(.*))?$/);
    if (!km){
      if (dashNode) add(dashNode.gt, dashNode.it, cleanVal(rest), ln);
      else errors.push(`Line ${ln}: "${rest.slice(0, 40)}" is not a "key: value" pair or a "- item". Check for a missing colon or a missing space after it.`);
      continue;
    }

    const key = cleanVal(km[1]) || km[1];
    while (stack.length > 1 && top().col >= col) stack.pop();
    const parent = top();
    sibling(parent, col, ln, "map");
    const gt = [...parent.gt, key], it = [...parent.it, key];
    const rawVal = (km[2] || "").trim();

    if (/^[|>][-+]?\d*\s*(#.*)?$/.test(rawVal)){
      const body = []; let j = i + 1;
      for (; j < lines.length; j++){
        const l = lines[j];
        if (!l.trim()){ body.push(""); continue; }
        if (l.match(/^ */)[0].length > lineCol) body.push(l); else break;
      }
      while (body.length && !body[body.length - 1].trim()) body.pop();
      const ind = body.filter(x => x.trim()).map(x => x.match(/^ */)[0].length);
      const min = ind.length ? Math.min(...ind) : 0;
      if (!body.length) errors.push(`Line ${ln}: "${key}: ${rawVal}" starts a multi-line block, but no indented lines follow.`);
      add(gt, it, body.map(x => x.slice(min)).join("\n"), ln);
      i = j - 1;
      continue;
    }

    const quoted = /^['"]/.test(rawVal);
    const v = cleanVal(rawVal);
    if (v === "" && !quoted){
      stack.push({col, gt, it, kids:null});
      add(gt, it, "", ln);
    } else if (!quoted && /^\[.*\]$/.test(v)){
      add(gt, it, "", ln);
      splitFlow(v.slice(1, -1)).forEach((x, k) => add([...gt, "[]"], [...it, `[${k}]`], cleanVal(x), ln));
      lastScalar = {col, key, ln};
    } else if (!quoted && /^\{.*\}$/.test(v)){
      add(gt, it, "", ln);
      splitFlow(v.slice(1, -1)).forEach(pair => {
        const pm = pair.match(/^(.+?)\s*:\s*(.*)$/);
        if (pm) add([...gt, cleanVal(pm[1])], [...it, cleanVal(pm[1])], cleanVal(pm[2]), ln);
      });
      lastScalar = {col, key, ln};
    } else {
      add(gt, it, v, ln);
      lastScalar = {col, key, ln};
    }
  }
  return {entries, errors};
}

function globRe(p){
  if (p instanceof RegExp) return p;
  return new RegExp("^" + p.split(/(\*\*|\*|\[\]\?)/).map(s =>
    s === "**" ? ".*" :
    s === "*" ? "[^.\\[\\]]*" :
    s === "[]?" ? "(\\[\\])?" :
    s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("") + "$", "i");
}
const valMatch = (v, w) => w === undefined ? true : w instanceof RegExp ? w.test(v) : String(v).toLowerCase() === String(w).toLowerCase();

function makeApi(entries, src){
  const find = (p, w) => { const re = globRe(p); return entries.filter(e => re.test(e.gen) && valMatch(e.value, w)); };
  return {
    src,
    h: (p, w) => find(p, w).length > 0,
    count: (p, w) => find(p, w).length,
    first: (p, w) => Math.min(Infinity, ...find(p, w).map(e => e.line)),
    item(listPath, conds){
      const re = globRe(listPath + "[]"), groups = new Map();
      for (const e of entries){
        for (let n = 1; n <= e.gt.length; n++){
          if (e.gt[n - 1] !== "[]" || !re.test(toStr(e.gt.slice(0, n)))) continue;
          const k = toStr(e.it.slice(0, n));
          if (!groups.has(k)) groups.set(k, []);
          groups.get(k).push({rel:toStr(e.gt.slice(n)), value:e.value});
        }
      }
      return [...groups.values()].some(list =>
        Object.entries(conds).every(([rp, w]) => { const r = globRe(rp); return list.some(x => r.test(x.rel) && valMatch(x.value, w)); }));
    }
  };
}

/* ===================================================================
   CHECKING (pure functions, no DOM: also used by the self-test)
   =================================================================== */
const norm = s => String(s).trim().replace(/\s+/g, " ").toLowerCase();
const sameSet = (a, b) => a.length === b.length && [...a].sort().join() === [...b].sort().join();

// Returns {ok, results:[{l, ok, sub?}], marks}  (marks drive per-item coloring)
function grade(ex, ans){
  switch (ex.type){
    case "mc": {
      const ok = ans === ex.answer;
      return {ok, results:[{l: ans === null || ans === undefined ? "Pick an answer first." : ok ? "Correct!" : "Not quite. Read the hint and try again.", ok}]};
    }
    case "multi": {
      const sel = ans || [];
      const missing = ex.answer.filter(i => !sel.includes(i)).length;
      const extra = sel.filter(i => !ex.answer.includes(i)).length;
      const ok = missing === 0 && extra === 0;
      const r = [];
      if (ok) r.push({l:"Correct! You found exactly the right options.", ok:true});
      else {
        r.push({l: missing ? `${missing} correct option${missing > 1 ? "s" : ""} not selected` : "All correct options selected", ok: !missing});
        r.push({l: extra ? `${extra} selected option${extra > 1 ? "s are" : " is"} wrong` : "No wrong options selected", ok: !extra});
      }
      return {ok, results:r};
    }
    case "order": {
      const seq = ans || [];
      const marks = seq.map((it, pos) => it === pos);
      const right = marks.filter(Boolean).length;
      const ok = right === ex.items.length;
      return {ok, marks, results:[{l: ok ? "Correct order!" : `${right}/${ex.items.length} items are in the right position.`, ok}]};
    }
    case "match": {
      const sel = ans || [];
      const marks = ex.rows.map((r, i) => sel[i] === r[1]);
      const right = marks.filter(Boolean).length;
      const ok = right === ex.rows.length;
      return {ok, marks, results:[{l: ok ? "All matches correct!" : `${right}/${ex.rows.length} matches correct.`, ok}]};
    }
    case "fill": {
      const vals = ans || [];
      const marks = ex.blanks.map((acc, i) => acc.some(a => norm(a) === norm(vals[i] || "")));
      const right = marks.filter(Boolean).length;
      const ok = right === ex.blanks.length;
      return {ok, marks, results:[{l: ok ? "All blanks correct!" : `${right}/${ex.blanks.length} blanks correct.`, ok}]};
    }
    case "lines": {
      const sel = ans || [];
      const missing = ex.answer.filter(i => !sel.includes(i)).length;
      const extra = sel.filter(i => !ex.answer.includes(i)).length;
      const ok = missing === 0 && extra === 0;
      const r = ok ? [{l:"Correct! You spotted exactly the right lines.", ok:true}] : [
        {l: missing ? `${missing} line${missing > 1 ? "s" : ""} still to find` : "You found every faulty line", ok: !missing},
        {l: extra ? `${extra} selected line${extra > 1 ? "s are" : " is"} actually fine` : "No correct lines selected by mistake", ok: !extra}];
      return {ok, results:r};
    }
    case "text": {
      const text = String(ans || "").replace(/\r/g, "");
      const results = [];
      let api;
      if (ex.lang === "yaml"){
        const p = parseYaml(text);
        results.push({l:"Valid YAML structure: spaces only, aligned siblings, key: value pairs", ok: p.errors.length === 0 && p.entries.length > 0, sub:p.errors});
        api = makeApi(p.entries, text.replace(/^\s*#.*$/gm, ""));
      } else {
        const lines = text.split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("#"));
        api = {src:text, lines};
      }
      for (const c of ex.checks){
        let ok = false;
        try { ok = !!c.t(api); } catch (e) { ok = false; }
        results.push({l:c.l, ok});
      }
      return {ok: results.every(r => r.ok), results};
    }
  }
  return {ok:false, results:[]};
}

// The model answer for each exercise, in the same shape grade() expects.
function modelAnswer(ex){
  switch (ex.type){
    case "mc": return ex.answer;
    case "multi": case "lines": return ex.answer.slice();
    case "order": return ex.items.map((_, i) => i);
    case "match": return ex.rows.map(r => r[1]);
    case "fill": return ex.blanks.map(b => b[0]);
    case "text": return ex.solution;
  }
}

// Deterministic shuffle so the starting order is stable between visits.
function scramble(id, n){
  let seed = 0; for (const ch of id) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (a.every((v, i) => v === i)) a.reverse();
  return a;
}

const ALL_EX = MODULES.flatMap(m => m.exercises);

/* ===================================================================
   HIGHLIGHTER (tiny, dependency-free)
   =================================================================== */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function commentAt(v){
  let q = null;
  for (let i = 0; i < v.length; i++){
    const ch = v[i];
    if (q){ if (ch === q) q = null; continue; }
    if ((ch === "'" || ch === '"') && (i === 0 || /\s/.test(v[i - 1]))){ q = ch; continue; }
    if (ch === "#" && (i === 0 || /\s/.test(v[i - 1]))) return i;
  }
  return -1;
}
function hlValue(v){
  const ci = commentAt(v);
  const body = ci >= 0 ? v.slice(0, ci) : v, comment = ci >= 0 ? v.slice(ci) : "";
  const t = body.trim();
  let out;
  if (/^(['"]).*\1$/.test(t)) out = `<span class="ts">${esc(body)}</span>`;
  else if (/^[|>][-+]?\d*$/.test(t)) out = `<span class="tk">${esc(body)}</span>`;
  else if (/^(true|false|none|null|~|-?\d+(\.\d+)?)$/i.test(t)) out = `<span class="tn">${esc(body)}</span>`;
  else out = esc(body);
  return out + (comment ? `<span class="tc">${esc(comment)}</span>` : "");
}
function hlYaml(code){
  let blockCol = -1;
  return code.split("\n").map(line => {
    const ind = line.match(/^ */)[0].length;
    if (blockCol >= 0){
      if (!line.trim() || ind > blockCol) return esc(line);
      blockCol = -1;
    }
    const [, sp, dash, rest] = line.match(/^(\s*)((?:-\s+|-$)*)(.*)$/);
    if (rest.startsWith("#")) return esc(sp + dash) + `<span class="tc">${esc(rest)}</span>`;
    let out = esc(sp) + (dash ? `<span class="tdash">${esc(dash)}</span>` : "");
    const km = /^['"]/.test(rest) ? null : rest.match(/^(.+?)(\s*:)(\s+.*)?$/);
    if (km){
      out += `<span class="tk">${esc(km[1])}</span>${esc(km[2])}`;
      if (km[3]){
        const lead = km[3].match(/^\s*/)[0], val = km[3].slice(lead.length);
        out += lead + hlValue(val);
        if (/^[|>][-+]?\d*\s*(#.*)?$/.test(val.trim())) blockCol = ind;
      }
    } else out += hlValue(rest);
    return out;
  }).join("\n");
}
function hlSh(code){
  return code.split("\n").map(line => {
    const m = line.match(/^(\s*)(#.*)$/);
    if (m) return esc(m[1]) + `<span class="tc">${esc(m[2])}</span>`;
    const ci = line.search(/\s#\s/);
    const body = ci >= 0 ? line.slice(0, ci) : line, c = ci >= 0 ? line.slice(ci) : "";
    return esc(body).replace(/^(\s*)(git|gh|dotnet|npm|npx|mvn|python|pytest|az|docker)\b/, '$1<span class="tk">$2</span>').replace(/(\s)(--?[\w-]+)/g, '$1<span class="tt">$2</span>')
      + (c ? `<span class="tc">${esc(c)}</span>` : "");
  }).join("\n");
}
function hlText(code){
  // highlight AB#123, #123, @mentions and trailing comments in plain text blocks
  return code.split("\n").map(line => {
    const ci = line.search(/\s{2,}(?=\S)/);
    const body = ci >= 0 ? line.slice(0, ci) : line, rest = ci >= 0 ? line.slice(ci) : "";
    const h = s => esc(s).replace(/(AB#\d+|(?:^|(?<=\s))[!#]\d+|@[\w-]+(?:\/[\w-]+)?)/g, '<span class="td">$1</span>');
    return h(body) + (rest ? `<span class="tc">${esc(rest)}</span>` : "");
  }).join("\n");
}
function highlight(code, lang){
  if (lang === "text") return hlText(code);
  if (lang === "sh") return hlSh(code);
  return hlYaml(code);
}
function codeBlock(code, lang){
  return `<div class="codewrap"><pre><code>${highlight(code, lang || "yaml")}</code></pre><button class="copy">Copy</button></div>`;
}

/* ===================================================================
   UI
   =================================================================== */
const KIND = {mc:"Single choice", multi:"Select all that apply", order:"Put in order", match:"Match", fill:"Fill in the blanks", lines:"Spot the error", text:"Write it"};

function startApp(){
  const store = {
    get(k, d){ try { const v = localStorage.getItem("pipeTestLab:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v){ try { localStorage.setItem("pipeTestLab:" + k, JSON.stringify(v)); } catch {} }
  };
  let done = store.get("done", []).filter(id => ALL_EX.some(e => e.id === id));
  let current = Math.min(store.get("current", 0), MODULES.length - 1);
  const $ = s => document.querySelector(s);
  const state = {};   // exercise id → current answer
  const modDone = m => m.exercises.filter(e => done.includes(e.id)).length;

  function renderNav(){
    let html = "", lastGroup = "";
    MODULES.forEach((m, i) => {
      if (m.group !== lastGroup){ html += `<div class="group">${m.group}</div>`; lastGroup = m.group; }
      const n = modDone(m), all = n === m.exercises.length;
      const cls = [i === current ? "active" : "", all ? "done" : ""].join(" ");
      html += `<button class="${cls}" data-i="${i}"><span class="num">${all ? "✓" : i + 1}</span>${m.title}<span class="cnt">${n}/${m.exercises.length}</span></button>`;
    });
    $("#nav").innerHTML = html;
    $("#bar").style.width = (done.length / ALL_EX.length * 100) + "%";
    $("#ptext").textContent = `${done.length} of ${ALL_EX.length} exercises completed`;
  }

  /* ---------- per-type input rendering ---------- */
  function bodyHtml(ex){
    const sid = ex.id;
    switch (ex.type){
      case "mc": case "multi":
        return `<div class="opts">${ex.options.map((o, i) =>
          `<label class="opt" data-i="${i}"><input type="${ex.type === "mc" ? "radio" : "checkbox"}" name="${sid}" value="${i}"><span>${o}</span></label>`).join("")}</div>`;
      case "order":
        return `<ol class="order" id="ol-${sid}"></ol>`;
      case "match":
        return `<table class="match">${ex.rows.map((r, i) =>
          `<tr data-i="${i}"><td>${r[0]}</td><td><select aria-label="Answer ${i + 1}"><option value="">— choose —</option>${ex.choices.map(c => `<option>${esc(c)}</option>`).join("")}</select></td></tr>`).join("")}</table>`;
      case "fill": {
        let k = 0;
        const html = ex.tpl.replace(/\[\[(\d+)\]\]/g, (_, n) => {
          const w = Math.max(6, ...ex.blanks[+n].map(b => b.length)) + 2;
          k++; return `<input data-b="${n}" size="${w}" aria-label="Blank ${+n + 1}" autocomplete="off" spellcheck="false">`;
        });
        return `<div class="fill${ex.mono ? " mono" : ""}">${html}</div>`;
      }
      case "lines":
        return `<div class="lines${ex.prose ? " prose" : ""}">${ex.code.map((l, i) =>
          `<div class="ln" data-i="${i}" role="button" tabindex="0"><span class="no">${i + 1}</span><span>${esc(l) || " "}</span></div>`).join("")}</div>`;
      case "text":
        return `<textarea class="${ex.lang === "yaml" ? "" : "short"}" spellcheck="false" aria-label="Answer editor"></textarea>
          <p class="edhelp">${ex.lang === "yaml" ? "Tab / Shift+Tab indent by 2 spaces · Enter keeps the indentation · " : ""}Ctrl+Enter checks your answer · your draft is saved automatically</p>`;
    }
  }

  function solutionHtml(ex){
    switch (ex.type){
      case "mc": return `<p><b>Answer:</b> ${ex.options[ex.answer]}</p>`;
      case "multi": return `<ul class="tips">${ex.answer.map(i => `<li>${ex.options[i]}</li>`).join("")}</ul>`;
      case "order": return `<ol class="tips">${ex.items.map(t => `<li>${t}</li>`).join("")}</ol>`;
      case "match": return `<div class="tablewrap"><table class="ref">${ex.rows.map(r => `<tr><td>${r[0]}</td><td><b>${esc(r[1])}</b></td></tr>`).join("")}</table></div>`;
      case "fill": {
        const html = ex.tpl.replace(/\[\[(\d+)\]\]/g, (_, n) => `<b><u>${esc(ex.blanks[+n][0])}</u></b>`);
        return `<div class="fill${ex.mono ? " mono" : ""}">${html}</div>`;
      }
      case "lines": return `<p>Faulty line${ex.answer.length > 1 ? "s" : ""}: ${ex.answer.map(i => `<b>${i + 1}</b>`).join(", ")}</p>`;
      case "text": return codeBlock(ex.solution, ex.lang === "yaml" ? "yaml" : "text");
    }
  }

  function wireExercise(ex, root){
    const id = ex.id;
    const q = s => root.querySelector(s);
    const draftKey = "draft:" + id;

    if (ex.type === "mc"){
      root.querySelectorAll("input").forEach(inp => inp.onchange = () => { state[id] = +inp.value; clearMarks(); });
      state[id] = null;
    }
    if (ex.type === "multi"){
      state[id] = [];
      root.querySelectorAll("input").forEach(inp => inp.onchange = () => {
        state[id] = [...root.querySelectorAll("input:checked")].map(x => +x.value); clearMarks();
      });
    }
    if (ex.type === "order"){
      state[id] = scramble(id, ex.items.length);
      const ol = q(".order");
      let dragFrom = null;
      const draw = (marks) => {
        ol.innerHTML = state[id].map((it, pos) =>
          `<li draggable="true" data-pos="${pos}" class="${marks ? (marks[pos] ? "right" : "wrong") : ""}"><span class="pos">${pos + 1}</span><span class="txt">${ex.items[it]}</span>
            <span class="mv"><button class="btn small" data-mv="-1" ${pos === 0 ? "disabled" : ""} aria-label="Move up">↑</button><button class="btn small" data-mv="1" ${pos === ex.items.length - 1 ? "disabled" : ""} aria-label="Move down">↓</button></span></li>`).join("");
      };
      const move = (from, to) => {
        const a = state[id]; const [x] = a.splice(from, 1); a.splice(to, 0, x); draw();
      };
      ol.onclick = e => {
        const b = e.target.closest("button[data-mv]"); if (!b) return;
        const pos = +b.closest("li").dataset.pos, to = pos + +b.dataset.mv;
        if (to >= 0 && to < ex.items.length) move(pos, to);
      };
      ol.addEventListener("dragstart", e => { const li = e.target.closest("li"); if (li){ dragFrom = +li.dataset.pos; e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", ""); } catch {} } });
      ol.addEventListener("dragover", e => { if (dragFrom !== null) e.preventDefault(); });
      ol.addEventListener("drop", e => { e.preventDefault(); const li = e.target.closest("li"); if (li && dragFrom !== null) move(dragFrom, +li.dataset.pos); dragFrom = null; });
      ol.addEventListener("dragend", () => { dragFrom = null; });
      root._draw = draw;
      draw();
    }
    if (ex.type === "match"){
      state[id] = ex.rows.map(() => "");
      root.querySelectorAll("select").forEach((s, i) => s.onchange = () => { state[id][i] = s.value; s.closest("tr").className = ""; });
    }
    if (ex.type === "fill"){
      state[id] = ex.blanks.map(() => "");
      root.querySelectorAll(".fill input").forEach(inp => {
        inp.oninput = () => { state[id][+inp.dataset.b] = inp.value; inp.className = ""; };
        inp.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); check(); } };
      });
    }
    if (ex.type === "lines"){
      state[id] = [];
      const toggle = el => {
        const i = +el.dataset.i, a = state[id];
        if (a.includes(i)) a.splice(a.indexOf(i), 1); else a.push(i);
        root.querySelectorAll(".ln").forEach(l => l.className = "ln" + (a.includes(+l.dataset.i) ? " sel" : ""));
      };
      root.querySelectorAll(".ln").forEach(el => {
        el.onclick = () => toggle(el);
        el.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(el); } };
      });
    }
    if (ex.type === "text"){
      const ed = q("textarea");
      const saved = store.get(draftKey, null);
      ed.value = saved !== null ? saved : ex.starter;
      state[id] = ed.value;
      const save = () => { state[id] = ed.value; store.set(draftKey, ed.value); };
      const insert = t => {
        ed.focus();
        if (!document.execCommand || !document.execCommand("insertText", false, t)){
          const s = ed.selectionStart, en = ed.selectionEnd;
          ed.value = ed.value.slice(0, s) + t + ed.value.slice(en);
          ed.selectionStart = ed.selectionEnd = s + t.length;
          save();
        }
      };
      ed.addEventListener("input", save);
      ed.addEventListener("keydown", e => {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); check(); return; }
        if (ex.lang !== "yaml") return;
        if (e.key === "Tab" && !e.shiftKey){ e.preventDefault(); insert("  "); return; }
        if (e.key === "Tab" && e.shiftKey){
          e.preventDefault();
          const s = ed.selectionStart, ls = ed.value.lastIndexOf("\n", s - 1) + 1;
          const n = ed.value.slice(ls, ls + 2).match(/^ {0,2}/)[0].length;
          if (n){ ed.value = ed.value.slice(0, ls) + ed.value.slice(ls + n); ed.selectionStart = ed.selectionEnd = Math.max(ls, s - n); save(); }
          return;
        }
        if (e.key === "Enter" && !e.shiftKey && !e.altKey){
          const before = ed.value.slice(0, ed.selectionStart);
          const line = before.slice(before.lastIndexOf("\n") + 1);
          let ind = line.match(/^ */)[0].length;
          const dm = line.slice(ind).match(/^(-\s+)+/);
          if (dm && /:/.test(line)) ind += dm[0].length;
          if (!/^\s*#/.test(line) && /(:|:\s*[|>][-+]?)\s*$/.test(line)) ind += 2;
          e.preventDefault();
          insert("\n" + " ".repeat(ind));
        }
      });
    }

    function clearMarks(){
      root.querySelectorAll(".opt").forEach(o => o.classList.remove("right", "wrong"));
    }

    function check(){
      const g = grade(ex, state[id]);
      // per-item coloring
      if (ex.type === "mc" || ex.type === "multi"){
        clearMarks();
        const sel = ex.type === "mc" ? (state[id] === null ? [] : [state[id]]) : state[id];
        sel.forEach(i => root.querySelector(`.opt[data-i="${i}"]`).classList.add(
          (ex.type === "mc" ? i === ex.answer : ex.answer.includes(i)) ? "right" : "wrong"));
      }
      if (ex.type === "order") root._draw(g.marks);
      if (ex.type === "match") root.querySelectorAll(".match tr").forEach((tr, i) => tr.className = g.marks[i] ? "right" : "wrong");
      if (ex.type === "fill") root.querySelectorAll(".fill input").forEach(inp => inp.className = g.marks[+inp.dataset.b] ? "right" : "wrong");
      if (ex.type === "lines") root.querySelectorAll(".ln").forEach(l => {
        const i = +l.dataset.i, sel = state[id].includes(i);
        l.className = "ln" + (sel ? (ex.answer.includes(i) ? " right" : " wrong") : "");
      });
      q(".results").innerHTML = g.results.map(r =>
        `<li class="${r.ok ? "pass" : "fail"}">${r.ok ? "✔" : "✘"} ${esc(r.l)}${(r.sub || []).map(s => `<span class="sub">↳ ${esc(s)}</span>`).join("")}</li>`).join("") +
        (ex.type === "text" ? `<li class="${g.ok ? "pass" : "fail"}"><b>${g.results.filter(r => r.ok).length}/${g.results.length} checks passed${g.ok ? ". Nice work! 🎉" : ""}</b></li>` : "");
      if (g.ok){
        q(".why").style.display = "block";
        if (!done.includes(id)){ done.push(id); store.set("done", done); renderNav(); }
        root.classList.add("solved");
      }
    }

    q(".checkBtn").onclick = check;
    q(".hintBtn").onclick = () => { const h = q(".hint"); h.style.display = h.style.display === "block" ? "none" : "block"; };
    q(".solBtn").onclick = e => {
      const s = q(".solution"), show = s.style.display !== "block";
      s.style.display = show ? "block" : "none";
      q(".why").style.display = show || root.classList.contains("solved") ? "block" : "none";
      e.target.textContent = show ? "Hide solution" : "Show solution";
    };
    q(".resetBtn").onclick = () => {
      if (ex.type === "text") store.set(draftKey, null);
      const fresh = document.createElement("section");
      root.replaceWith(fresh);
      buildExercise(ex, fresh);
    };
  }

  function buildExercise(ex, el){
    const n = ALL_EX.indexOf(ex) + 1;
    el.className = "exercise" + (done.includes(ex.id) ? " solved" : "");
    el.id = "ex-" + ex.id;
    el.innerHTML = `
      <h3>🧪 ${n}. ${ex.title} <span class="kind">${KIND[ex.type]}</span> <span class="badge">Completed</span></h3>
      <div>${ex.q}</div>
      ${bodyHtml(ex)}
      <div class="btns">
        <button class="btn primary checkBtn">Check my answer</button>
        <button class="btn hintBtn">Hint</button>
        <button class="btn solBtn">Show solution</button>
        <button class="btn resetBtn">Reset</button>
      </div>
      <div class="hint">💡 ${ex.hint}</div>
      <ul class="results"></ul>
      <div class="solution"><p class="solhead">Model answer</p>${solutionHtml(ex)}</div>
      <div class="why"><b>Why:</b> ${ex.why}</div>`;
    wireExercise(ex, el);
  }

  function renderModule(){
    const m = MODULES[current];
    const sections = m.sections.map(s => `
        <h3>${s.h}</h3>
        ${s.p ? `<p>${s.p}</p>` : ""}
        ${s.file ? `<div class="file">${s.file}</div>` : ""}
        ${s.code ? codeBlock(s.code, s.lang) : ""}
        ${s.after || ""}`).join("");

    $("#content").innerHTML = `
      <span class="tag">Module ${current + 1} of ${MODULES.length} · ${m.tag}</span>
      <h2>${m.title}</h2>
      <p class="lead">${m.intro}</p>
      ${sections}
      ${m.tip ? `<div class="note exam">🎯 <b>AZ-400 exam tip:</b> ${m.tip}</div>` : ""}
      <h3 style="margin-top:36px">Exercises (${m.exercises.length})</h3>
      <div id="exlist"></div>
      <div class="navfoot">
        <button class="btn" id="prevBtn" ${current === 0 ? "disabled" : ""}>← Previous</button>
        <button class="btn" id="nextBtn" ${current === MODULES.length - 1 ? "disabled" : ""}>Next →</button>
      </div>`;
    const list = $("#exlist");
    m.exercises.forEach(ex => { const el = document.createElement("section"); list.appendChild(el); buildExercise(ex, el); });
    $("#prevBtn").onclick = () => go(current - 1);
    $("#nextBtn").onclick = () => go(current + 1);
    renderNav();
    window.scrollTo(0, 0);
  }

  function go(i){
    if (i < 0 || i >= MODULES.length) return;
    current = i; store.set("current", i);
    $("#side").classList.remove("open");
    renderModule();
  }

  $("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(+b.dataset.i); });
  $("#menuBtn").onclick = () => $("#side").classList.toggle("open");
  document.addEventListener("click", e => {
    if (!e.target.classList.contains("copy")) return;
    const text = e.target.previousElementSibling.innerText;
    navigator.clipboard?.writeText(text).then(() => { e.target.textContent = "Copied!"; setTimeout(() => e.target.textContent = "Copy", 1200); });
  });
  $("#themeBtn").onclick = () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark"; store.set("theme", root.dataset.theme);
  };
  $("#resetAllBtn").onclick = () => {
    if (!confirm("Reset all progress and saved drafts for this lab?")) return;
    done = []; store.set("done", done);
    ALL_EX.filter(e => e.type === "text").forEach(e => store.set("draft:" + e.id, null));
    renderModule();
  };
  const t = store.get("theme", null); if (t) document.documentElement.dataset.theme = t;

  renderModule();
}

if (typeof document !== "undefined" && document.getElementById("content")) startApp();
</script>
